id: io.github.takmikill.GameTable
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: gametable
separate-locales: false

sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22

finish-args:
  # The whole application is an OpenRouter client.
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # Optional keyring backing for the API key (portal Secret is preferred).
  - --talk-name=org.freedesktop.secrets
  # No --filesystem=home: imports and exports go through the file chooser portal.

modules:
  - name: gametable
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin
      env:
        XDG_CACHE_HOME: /run/build/gametable/flatpak-node/cache
        npm_config_cache: /run/build/gametable/flatpak-node/npm-cache
        npm_config_offline: 'true'
        npm_config_nodedir: /usr/lib/sdk/node22
    build-commands:
      # Offline install from the vendored node sources.
      - npm ci
      # The Electron2 BaseApp provides zypak, not Chromium itself; the binary
      # comes from the npm package, cached by flatpak-node-generator.
      - npm run build -w @gametable/desktop
      - mkdir -p /app/gametable
      - cp -r apps/desktop/dist /app/gametable/dist
      - cp -r node_modules/electron/dist /app/gametable/electron
      - cp apps/desktop/package.json /app/gametable/package.json
      - install -Dm755 flatpak/gametable.sh /app/bin/gametable
      - install -Dm644 flatpak/io.github.takmikill.GameTable.metainfo.xml
        /app/share/metainfo/io.github.takmikill.GameTable.metainfo.xml
      - install -Dm644 flatpak/io.github.takmikill.GameTable.desktop
        /app/share/applications/io.github.takmikill.GameTable.desktop
      - install -Dm644 flatpak/io.github.takmikill.GameTable.svg
        /app/share/icons/hicolor/scalable/apps/io.github.takmikill.GameTable.svg
    sources:
      # For a release build point this at the public repository.
      # For a local build, a path to a local git checkout works too.
      - type: git
        url: /home/takmikill/gametable
        branch: main
      # Generated by flatpak/generate-sources.sh (flatpak-node-generator).
      - node-sources.json
