id: io.github.takmikill.GameTable
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: gametable
separate-locales: false

sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22

finish-args:
  # The whole application is an OpenRouter client.
  - --share=network
  # X11 fallback uses shared-memory IPC (required by Flathub's X11 checks).
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # Optional keyring backing for the API key (portal Secret is preferred).
  - --talk-name=org.freedesktop.secrets
  # No --filesystem=home: imports and exports go through the file chooser portal.

modules:
  # CPU-only neural speech, built entirely from source. Model weights are data,
  # not executable code. No upstream Piper/ONNX Runtime binary bundle is used.
  - modules/piper.json
  - name: piper-voice
    buildsystem: simple
    build-commands:
      - mkdir -p /app/piper/voices
      - install -m644 en_US-libritts_r-medium.onnx en_US-libritts_r-medium.onnx.json /app/piper/voices/
      - install -Dm644 MODEL_CARD /app/share/licenses/piper-voice/MODEL_CARD
      - install -Dm644 SPEECH-NOTICES.md /app/share/doc/gametable/SPEECH-NOTICES.md
      - python3 smoke-tts.py
    sources:
      - type: file
        url: https://huggingface.co/rhasspy/piper-voices/resolve/5041a7a49ae5b3a0f30e6837769eb03fdbb231bd/en/en_US/libritts_r/medium/en_US-libritts_r-medium.onnx
        sha256: 10bb85e071d616fcf4071f369f1799d0491492ab3c5d552ec19fb548fac13195
        dest-filename: en_US-libritts_r-medium.onnx
      - type: file
        url: https://huggingface.co/rhasspy/piper-voices/resolve/5041a7a49ae5b3a0f30e6837769eb03fdbb231bd/en/en_US/libritts_r/medium/en_US-libritts_r-medium.onnx.json
        sha256: b471dc60d2d8335e819c393d196d6fbf792817f40051257b269878505bc9afb3
        dest-filename: en_US-libritts_r-medium.onnx.json
      - type: file
        url: https://huggingface.co/rhasspy/piper-voices/resolve/5041a7a49ae5b3a0f30e6837769eb03fdbb231bd/en/en_US/libritts_r/medium/MODEL_CARD
        sha256: 0ccde6927e5bb4d743f4ea39618a9387ba18cca3351220a8a9cfdbc68b30fcb9
      - type: file
        path: modules/smoke-tts.py
      - type: file
        path: modules/SPEECH-NOTICES.md

  - name: gametable
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin
      env:
        XDG_CACHE_HOME: /run/build/gametable/flatpak-node/cache
        npm_config_cache: /run/build/gametable/flatpak-node/npm-cache
        npm_config_offline: 'true'
        npm_config_nodedir: /usr/lib/sdk/node22
        # Electron's binary is a manifest source, placed where @electron/get
        # looks. Nothing is downloaded during the build.
        electron_config_cache: /run/build/gametable/flatpak-node/electron-cache
    build-commands:
      - npm ci
      # npm does not always run dependency postinstalls in this SDK; run the
      # Electron installer explicitly. It reads the pre-fetched zip from
      # electron_config_cache, so nothing is downloaded here.
      - node node_modules/electron/install.js
      - npm run build -w @gametable/desktop
      - mkdir -p /app/gametable
      - cp -r apps/desktop/dist /app/gametable/dist
      - cp -r node_modules/electron/dist /app/gametable/electron
      - cp apps/desktop/package.json /app/gametable/package.json
      - install -Dm755 flatpak/gametable.sh /app/bin/gametable
      - install -Dm644 flatpak/io.github.takmikill.GameTable.metainfo.xml
        /app/share/metainfo/io.github.takmikill.GameTable.metainfo.xml
      - install -Dm644 flatpak/io.github.takmikill.GameTable.desktop
        /app/share/applications/io.github.takmikill.GameTable.desktop
      - install -Dm644 flatpak/io.github.takmikill.GameTable.svg
        /app/share/icons/hicolor/scalable/apps/io.github.takmikill.GameTable.svg
    sources:
      # build.sh rewrites this to the local checkout for local builds.
      - type: git
        url: https://github.com/fpetersen5-cpu/Gametable.git
        branch: main
      # Offline npm tarballs (flatpak-node-generator).
      - node-sources.json
      # Electron's runtime binary, pre-fetched as a source. The directory name
      # is sha256("https://github.com/electron/electron/releases/download/v44.9.3"),
      # which is where @electron/get looks when electron_config_cache is set.
      - type: file
        url: https://github.com/electron/electron/releases/download/v44.9.3/electron-v44.9.3-linux-x64.zip
        only-arches: [x86_64]
        sha256: 6e7fd2d450d442507b846ace4ae6e2bd17e1b1653e86a033b5231abfc23e6df4
        dest: flatpak-node/electron-cache/902aaaf97776b0cc78be070e68179849dc7cd5aca622b2a809146b1684b69562
        dest-filename: electron-v44.9.3-linux-x64.zip
