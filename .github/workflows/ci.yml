name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Electron is listed under devDependencies but its runtime is shipped.
      # Audit the full tree, not only --omit=dev.
      - run: npm run audit:deps
      - run: npm run typecheck
      - run: npm run lint:games
      - run: npm test
      - run: npm run build
      - run: python3 -m unittest discover -s flatpak/tests -v
      - run: python3 -m unittest discover -s scripts/tests -v

  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install flatpak toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder pipx appstream desktop-file-utils
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --noninteractive flathub \
            org.flatpak.Builder \
            org.freedesktop.Sdk//26.08 \
            org.freedesktop.Sdk.Extension.node22//26.08 \
            org.electronjs.Electron2.BaseApp//26.08

      - name: Validate desktop metadata
        run: |
          appstreamcli validate --no-net flatpak/io.github.fpetersen5_cpu.GameTable.metainfo.xml
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder \
            appstream flatpak/io.github.fpetersen5_cpu.GameTable.metainfo.xml
          desktop-file-validate flatpak/io.github.fpetersen5_cpu.GameTable.desktop
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder \
            manifest flatpak/flathub/io.github.fpetersen5_cpu.GameTable.json

      - name: Rebuild npm sources (validates the committed file)
        run: |
          pipx install flatpak-node-generator
          cp flatpak/node-sources.json /tmp/sources.committed.json
          # Run in pipx's installed environment. Do not swallow generator errors
          # or accept stale sources merely because their count is similar.
          "$(pipx environment --value PIPX_LOCAL_VENVS)/flatpak-node-generator/bin/python" flatpak/generate-sources.py
          python3 flatpak/check-node-sources.py /tmp/sources.committed.json flatpak/node-sources.json

      - name: Build bundle
        env:
          GAMETABLE_GPG_KEY: ${{ secrets.GAMETABLE_GPG_KEY }}
          GAMETABLE_GPG_HOME: ${{ github.workspace }}/.gnupg
          GAMETABLE_REPO_URL: ${{ vars.GAMETABLE_REPO_URL }}
        run: |
          if [ -n "${GAMETABLE_GPG_KEY:-}" ]; then
            mkdir -p "$GAMETABLE_GPG_HOME" && chmod 700 "$GAMETABLE_GPG_HOME"
            echo "${{ secrets.GAMETABLE_GPG_PRIVATE_KEY }}" | gpg --homedir "$GAMETABLE_GPG_HOME" --batch --import
            ./flatpak/release.sh
          else
            ./flatpak/build.sh
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gametable-flatpak
          path: |
            GameTable-fpetersen5_cpu.flatpak
            GameTable-fpetersen5_cpu.flatpakref
            gametable.gpg
          if-no-files-found: warn
