name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Electron is listed under devDependencies but its runtime is shipped.
      # Audit the full tree, not only --omit=dev.
      - run: npm run audit:deps
      - run: npm run typecheck
      - run: npm run lint:games
      - run: npm test
      - run: npm run build

  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install flatpak toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder pipx
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --noninteractive flathub \
            org.flatpak.Builder \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.node22//25.08 \
            org.electronjs.Electron2.BaseApp//25.08

      - name: Rebuild npm sources (validates the committed file)
        run: |
          pipx install flatpak-node-generator
          pipx runpip flatpak-node-generator show >/dev/null
          cp flatpak/node-sources.json /tmp/sources.committed.json
          pipx run --spec flatpak-node-generator python flatpak/generate-sources.py || true
          # The generator is not byte-stable across runs; fail only if the
          # package count collapses (the bug this wrapper works around).
          python3 - <<'PY'
          import json
          committed = json.load(open('/tmp/sources.committed.json'))
          fresh = json.load(open('flatpak/node-sources.json'))
          assert len(fresh) >= len(committed) * 0.95, (len(fresh), len(committed))
          print(f'sources ok: {len(fresh)}')
          PY

      - name: Build bundle
        env:
          GAMETABLE_GPG_KEY: ${{ secrets.GAMETABLE_GPG_KEY }}
          GAMETABLE_GPG_HOME: ${{ github.workspace }}/.gnupg
          GAMETABLE_REPO_URL: ${{ vars.GAMETABLE_REPO_URL }}
        run: |
          if [ -n "${GAMETABLE_GPG_KEY:-}" ]; then
            mkdir -p "$GAMETABLE_GPG_HOME" && chmod 700 "$GAMETABLE_GPG_HOME"
            echo "${{ secrets.GAMETABLE_GPG_PRIVATE_KEY }}" | gpg --homedir "$GAMETABLE_GPG_HOME" --batch --import
            ./flatpak/release.sh
          else
            ./flatpak/build.sh
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gametable-flatpak
          path: |
            GameTable.flatpak
            GameTable.flatpakref
            gametable.gpg
          if-no-files-found: warn
